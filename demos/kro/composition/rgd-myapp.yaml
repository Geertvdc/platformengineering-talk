# Platform composition: MyApp → Namespace + RBAC + ASO StorageAccount
#
# Platform team writes this once. Developers never edit this file — they only
# write a MyApp instance (demos/kro/samples/myapp.yaml) with name, team, and size.
#
# Platform opinions encoded here (NOT exposed to developers):
#   - Azure region:        westeurope
#   - Resource group:      kro-demo-rg  (dedicated to this demo — see bootstrap/bootstrap.sh)
#   - Storage naming:      "st" + spec.name  (e.g. "stmyapp")
#   - Security baseline:   TLS 1.2, no public blob access
#   - Size → SKU mapping:  small=LRS, medium=GRS, large=RAGRS
#
# Note on connection secrets: ASO's operatorSpec.secrets uses a freeform map
# that KRO cannot introspect (x-kubernetes-preserve-unknown-fields). Connection
# secret wiring is therefore handled outside KRO — e.g. via a SecretProviderClass
# or a post-provisioning job — and is not part of this composition.
#
# Prereqs: KRO controller running in kro-system, ASO installed on the platform cluster.
#          Run demos/kro/bootstrap/bootstrap.sh to set up everything for this demo.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: myapp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schema:
    apiVersion: v1alpha1
    kind: MyApp
    spec:
      name:
        type: string
        description: >-
          Logical app name. Used to derive the app namespace and Azure Storage
          Account name ("st<name>").
          Must be 3–18 lowercase alphanumeric characters.
      team:
        type: string
        description: >-
          Team name. Bound to the built-in "edit" ClusterRole in the app
          namespace — team members can deploy workloads without cluster-admin.
      size:
        type: string
        default: small
        description: >-
          Storage tier. Maps to Azure replication:
          small = LRS, medium = GRS, large = RAGRS.

  resources:
    # ── App Namespace ──────────────────────────────────────────────────────────
    - id: appnamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.name}
          labels:
            app.kubernetes.io/managed-by: kro
            team: ${schema.spec.team}

    # ── RBAC — bind team group to the edit ClusterRole in the app namespace ───
    - id: rolebinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.spec.team}-edit
          namespace: ${schema.spec.name}
        subjects:
          - kind: Group
            name: ${schema.spec.team}
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          kind: ClusterRole
          name: edit
          apiGroup: rbac.authorization.k8s.io

    # ── ASO Storage Account ────────────────────────────────────────────────────
    - id: storageaccount
      template:
        apiVersion: storage.azure.com/v1api20210401
        kind: StorageAccount
        metadata:
          name: st${schema.spec.name}
          namespace: ${schema.spec.name}
        spec:
          location: westeurope
          kind: StorageV2
          owner:
            # armId targets the kro-demo-specific resource group.
            # Set by bootstrap/bootstrap.sh — do not edit manually.
            armId: /subscriptions/b8affb75-1fd8-4116-8065-dc871fdbe8bc/resourceGroups/kro-demo-rg
          sku:
            name: "${schema.spec.size == 'large' ? 'Standard_RAGRS' : schema.spec.size == 'medium' ? 'Standard_GRS' : 'Standard_LRS'}"
          accessTier: Hot
          minimumTlsVersion: TLS1_2
          allowBlobPublicAccess: false
