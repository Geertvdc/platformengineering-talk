apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xappteams-azure-github
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    provider: azure-github
    platform: "true"
spec:
  compositeTypeRef:
    apiVersion: platform.demo.io/v1alpha1
    kind: XAppTeam

  resources:
    # ── Azure Resource Group ──────────────────────────────────────────────────
    - name: resource-group
      base:
        apiVersion: azure.upbound.io/v1beta1
        kind: ResourceGroup
        spec:
          forProvider:
            location: westeurope
            tags:
              managed-by: crossplane
              platform: "true"
              environment: demo
              source: gitops
          providerConfigRef:
            name: default
      patches:
        # RG name: rg-team-<teamName>
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: metadata.annotations[crossplane.io/external-name]
          transforms:
            - type: string
              string:
                type: Format
                fmt: "rg-team-%s"
        # Tag the RG with the team name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: spec.forProvider.tags[team]
        # Surface RG name in XR status
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.annotations[crossplane.io/external-name]
          toFieldPath: status.resourceGroupName

    # ── Azure Storage Account ─────────────────────────────────────────────────
    - name: storage-account
      base:
        apiVersion: storage.azure.upbound.io/v1beta1
        kind: Account
        spec:
          forProvider:
            accountKind: StorageV2
            accountTier: Standard
            accountReplicationType: LRS
            location: westeurope
            httpsTrafficOnlyEnabled: true
            minTlsVersion: TLS1_2
            tags:
              managed-by: crossplane
              platform: "true"
              environment: demo
              source: gitops
          providerConfigRef:
            name: default
      patches:
        # Account name: stteam<teamName>
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: metadata.annotations[crossplane.io/external-name]
          transforms:
            - type: string
              string:
                type: Format
                fmt: "stteam%s"
        # Place the account in the team's RG (derived from teamName)
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: spec.forProvider.resourceGroupName
          transforms:
            - type: string
              string:
                type: Format
                fmt: "rg-team-%s"
        # Tag with team name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: spec.forProvider.tags[team]
        # Surface Storage Account name in XR status
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.annotations[crossplane.io/external-name]
          toFieldPath: status.storageAccountName

    # ── GitHub Repository ─────────────────────────────────────────────────────
    - name: github-repo
      base:
        apiVersion: repo.github.upbound.io/v1alpha1
        kind: Repository
        spec:
          forProvider:
            visibility: private
            autoInit: true
          providerConfigRef:
            name: github-default
      patches:
        # Repo name: <teamName>-platform-infra
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: metadata.annotations[crossplane.io/external-name]
          transforms:
            - type: string
              string:
                type: Format
                fmt: "%s-platform-infra"
        # Set repo description using teamName
        - type: FromCompositeFieldPath
          fromFieldPath: spec.teamName
          toFieldPath: spec.forProvider.description
          transforms:
            - type: string
              string:
                type: Format
                fmt: "Platform infrastructure repository for team %s"
        # Set the GitHub org from the claim spec
        - type: FromCompositeFieldPath
          fromFieldPath: spec.githubOrg
          toFieldPath: spec.forProvider.org
        # Surface repo name in XR status
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.annotations[crossplane.io/external-name]
          toFieldPath: status.githubRepoName
