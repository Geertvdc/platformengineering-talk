apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappteams.platform.demo.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: platform.demo.io
  names:
    kind: XAppTeam
    plural: xappteams
  claimNames:
    kind: AppTeam
    plural: appteams
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                teamName:
                  type: string
                  description: >-
                    Logical team name. Used to derive all resource names:
                    Azure RG (rg-team-<teamName>), Storage Account
                    (stteam<teamName>), GitHub repo (<teamName>-platform-infra).
                    Must be 3–16 lowercase alphanumeric characters.
                githubOrg:
                  type: string
                  description: >-
                    GitHub organization where the team repository is created.
              required:
                - teamName
                - githubOrg
            status:
              type: object
              properties:
                resourceGroupName:
                  type: string
                  description: Provisioned Azure Resource Group name.
                storageAccountName:
                  type: string
                  description: Provisioned Azure Storage Account name.
                githubRepoName:
                  type: string
                  description: Provisioned GitHub repository name.
