# CloudResource: live demo instance
#
# This is what a developer commits to request infrastructure.
# References the Revision (platform template) — developer only sets variables.
#
# One CloudResource → Terranetes runs OpenTofu → Azure RG + GitHub repo.
#
# Terranetes equivalent of a Crossplane AppTeam claim.
apiVersion: terraform.appvia.io/v1alpha1
kind: CloudResource
metadata:
  name: techorama-team
  namespace: terranetes-demo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # References the plan name + revision from the Revision's spec.plan block.
  # (plan.name: teaminfra, plan.revision: 1.0.0)
  plan:
    name: teaminfra
    revision: "1.0.0"

  # Auto-approve the plan so apply runs immediately after planning.
  enableAutoApproval: true

  variables:
    team_name: techorama-demo
    environment: dev
    location: westeurope
    github_org: Geertvdc
    github_repo_visibility: public

  writeConnectionSecretToRef:
    name: techorama-team-outputs
