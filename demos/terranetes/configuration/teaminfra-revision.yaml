# Terranetes Revision: TeamInfra
#
# Platform team template. Defines WHAT can be provisioned and WHERE the module lives.
# Developers never edit this — they submit a CloudResource that references it.
#
# This is the Terranetes equivalent of Crossplane's Composition:
#   Crossplane: XRD + Composition  →  developer submits AppTeam claim
#   Terranetes: Revision           →  developer submits CloudResource
#
# The module provisions:
#   - Azure Resource Group  (azurerm provider)
#   - GitHub repository     (integrations/github provider)
#
# Note: GITHUB_TOKEN is injected via the 'azure' Provider secret (combined creds).
# See bootstrap/30-github-creds.sh which patches GITHUB_TOKEN into azure-provider-creds.
apiVersion: terraform.appvia.io/v1alpha1
kind: Revision
metadata:
  name: teaminfra-v1
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Allow ArgoCD to update this Revision even while a CloudResource is using it.
    terraform.appvia.io/revision.skip-update-protection: "true"
spec:
  # plan groups this Revision under a named plan with a semantic version.
  plan:
    name: teaminfra
    description: "Provisions an Azure Resource Group and a GitHub repository for a team."
    revision: "1.0.0"

  # configuration holds the module source and provider wiring.
  configuration:
    module: https://github.com/Geertvdc/platformengineering-talk//demos/terranetes/module?ref=main
    # auth references a secret with GIT_PASSWORD — required because the repo is private.
    # The Terranetes source downloader uses GIT_PASSWORD to authenticate git clone.
    # Created by bootstrap/30-github-creds.sh.
    auth:
      name: git-module-creds
      namespace: terranetes-system
    providerRef:
      name: azure
      namespace: terranetes-system
    enableAutoApproval: true
    enableDriftDetection: true

  # Allowed input variables (developers customise these via CloudResource).
  inputs:
    - key: team_name
      description: "Short team name — lowercase letters and hyphens, 3–20 chars."
      required: true
    - key: environment
      description: "Deployment environment: dev, staging, or prod."
      required: false
      default:
        value: "dev"
    - key: location
      description: "Azure region for the resource group."
      required: false
      default:
        value: "westeurope"
    - key: github_org
      description: "GitHub organisation or username."
      required: true
    - key: github_repo_visibility
      description: "GitHub repository visibility: public, private, or internal."
      required: false
      default:
        value: "private"
