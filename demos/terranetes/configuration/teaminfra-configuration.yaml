# Terranetes Configuration: TeamInfra
#
# Platform team template. This Configuration provisions:
#   - Azure Resource Group  (azurerm provider)
#   - GitHub repository     (github provider)
#
# The module lives in this repo so it is versioned and GitOps-safe.
# Developers customise only spec.variables in their own namespace.
#
# The github-provider-creds Secret (containing GITHUB_TOKEN) is pulled in via
# spec.envFrom so the integrations/github provider can authenticate without
# the token appearing in this manifest.
apiVersion: terraform.appvia.io/v1alpha1
kind: Configuration
metadata:
  name: teaminfra
  namespace: terranetes-demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Module source: the Terraform module stored in this repository.
  # Pinned to main; change ?ref= to a tag for a production rollout.
  module: https://github.com/Geertvdc/platformengineering-talk//demos/terranetes/module?ref=main

  # Which Terranetes Provider supplies the Azure credentials.
  providerRef:
    name: azure
    namespace: terranetes-system

  # Variables passed to the Terraform module.
  variables:
    team_name: techorama-demo
    environment: dev
    location: westeurope
    github_org: Geertvdc
    github_repo_visibility: public

  # Inject the GITHUB_TOKEN env var from a Secret so the github provider
  # can authenticate without storing the token in this manifest.
  envFrom:
    - secret:
        name: github-provider-creds
        namespace: terranetes-system

  # Store the Terraform state in a Kubernetes Secret in this namespace.
  # In production, use a remote backend (Azure Blob Storage).
  writeOutputsToSecret:
    name: teaminfra-outputs
