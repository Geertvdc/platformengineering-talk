# Terranetes Revision (platform template) — synced before the live demo sample.
# Manages: Revision resource that defines what the teaminfra module provisions.
#
# The Provider itself is applied imperatively by bootstrap/40-configure-providers.sh
# (it references a Secret that cannot live in Git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terranetes-configuration
  namespace: argocd
  labels:
    demo: demo-5
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Geertvdc/platformengineering-talk
    targetRevision: main
    path: demos/terranetes/configuration
  destination:
    server: https://kubernetes.default.svc
    namespace: terranetes-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Ignore fields the Terranetes controller writes back to the Revision spec
  # (conditions, lastReconcile, lastSuccess) and labels/finalizers it manages.
  ignoreDifferences:
    - group: terraform.appvia.io
      kind: Revision
      jsonPointers:
        - /metadata/finalizers
        - /metadata/labels/terraform.appvia.io~1plan
        - /metadata/labels/terraform.appvia.io~1revision-name
        - /spec/conditions
        - /spec/lastReconcile
        - /spec/lastSuccess
