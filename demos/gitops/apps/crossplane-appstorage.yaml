# XRD + Composition only — no claims here.
# Claims live in crossplane-appstorage-claims.yaml which syncs AFTER this app
# is Healthy (i.e. after the AppStorage CRD is registered by Crossplane).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-appstorage
  namespace: argocd
  labels:
    demo: demo-3
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Geertvdc/platformengineering-talk
    targetRevision: main
    path: demos/crossplane/composition/appstorage
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
