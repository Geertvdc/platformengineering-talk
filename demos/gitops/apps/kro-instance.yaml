apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro-demo-instance
  namespace: argocd
  labels:
    demo: demo-4
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Geertvdc/platformengineering-talk
    targetRevision: main
    path: demos/kro/samples
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
