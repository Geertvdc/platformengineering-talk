# Argo CD Application — KRO demo, platform layer (RGD).
#
# Points at demos/kro/composition/ and keeps the ResourceGraphDefinition in sync.
# This is the platform team's concern — it registers the MyApp CRD on the cluster.
#
# The developer-facing layer is a separate Application: kro-instance.yaml
# It points at demos/kro/samples/ — committing myapp.yaml there is the live demo action.
#
# Convention: one Application per concern per demo in this folder.
# No demo modifies another demo's folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro-demo
  namespace: argocd
  labels:
    demo: demo-4
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Geertvdc/platformengineering-talk
    targetRevision: main
    path: demos/kro/composition
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
