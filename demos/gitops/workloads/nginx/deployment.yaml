apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  namespace: gitops-demo
  labels:
    app: demo-nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
